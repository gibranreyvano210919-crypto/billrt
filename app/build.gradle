plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'androidx.navigation.safeargs.kotlin'
    id 'com.google.gms.google-services'
}

// 1. Fungsi Otomasi Versi
def getAutoVersionCode() {
    // Menghasilkan angka unik berdasarkan waktu (menit). Play Store mewajibkan angka yang selalu naik.
    return (int) (System.currentTimeMillis() / 60000)
}

def getAutoVersionName() {
    def date = new Date()
    // Menghasilkan nama versi seperti 1.0.20260204 (TahunBulanTanggal)
    return "1.0." + date.format('yyyyMMdd')
}

// 2. Baca token dari local.properties
Properties properties = new Properties()
if (rootProject.file("local.properties").exists()) {
    properties.load(rootProject.file("local.properties").newDataInputStream())
}

android {
    namespace 'com.linkbit.billrt'
    compileSdk 36

    defaultConfig {
        applicationId "com.linkbit.billrt"
        minSdk 24
        targetSdk 36

        // Menggunakan fungsi otomatis
        versionCode getAutoVersionCode()
        versionName getAutoVersionName()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Batasi bahasa resource hanya untuk Bahasa Indonesia & Inggris (menghapus translasi bahasa lain yang tidak dipakai)
        resourceConfigurations += ["id", "en"]
    }

    // Pemisahan APK berdasarkan arsitektur CPU (Sangat efektif untuk library berukuran besar seperti Mapbox v11)
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }

    buildTypes {
        release {
            minifyEnabled true // R8 Code Shrinking & Obfuscation
            shrinkResources true // Mengosongkan resource/gambar library yang tidak terpakai
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 3. Update ke Java 17 untuk SDK 36 & Library Terbaru
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    // Core & UI
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.gridlayout:gridlayout:1.1.0'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'

    // CameraX
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'

    // Retrofit & OkHttp
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    // Google Services
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    // OpenStreetMap (osmdroid)
    implementation 'org.osmdroid:osmdroid-android:6.1.18'

    // Chart
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Utilities
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'com.cloudinary:cloudinary-android:2.4.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Firebase (BOM mengelola versi secara otomatis)
    implementation platform('com.google.firebase:firebase-bom:33.1.1')
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-database-ktx'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

tasks.register('sendApkToTelegram') {
    dependsOn 'assembleDebug'
    doLast {
        def apkFile = file("${layout.buildDirectory.get()}/outputs/apk/debug/app-debug.apk")
        if (!apkFile.exists()) {
            def tree = fileTree(dir: "${layout.buildDirectory.get()}/outputs/apk", include: "**/*.apk")
            if (!tree.isEmpty()) {
                apkFile = tree.files.find { it.name.contains("arm64-v8a") } ?: tree.first()
            }
        }
        
        if (apkFile.exists()) {
            println "Mengirim APK ${apkFile.name} ke Telegram via Java HTTP..."
            String token = "5818535303:AAE78Ew9YsjdDEjWqXW0y-NkkoZ5bGCvuzg"
            String chatId = "5396063519"
            String caption = "✅ Build APK Lokal Berhasil! (Billrt Lite)\n📦 File: " + apkFile.name

            String boundary = "===" + System.currentTimeMillis() + "==="
            URL url = new URL("https://api.telegram.org/bot${token}/sendDocument")
            HttpURLConnection conn = (HttpURLConnection) url.openConnection()
            conn.setDoOutput(true)
            conn.setUseCaches(false)
            conn.setRequestMethod("POST")
            conn.setRequestProperty("Connection", "Keep-Alive")
            conn.setRequestProperty("Cache-Control", "no-cache")
            conn.setRequestProperty("Content-Type", "multipart/form-data; boundary=" + boundary)
            conn.setChunkedStreamingMode(0)

            OutputStream outputStream = conn.getOutputStream()
            PrintWriter writer = new PrintWriter(new OutputStreamWriter(outputStream, "UTF-8"), true)

            // Send chat_id
            writer.append("--" + boundary).append("\r\n")
            writer.append("Content-Disposition: form-data; name=\"chat_id\"").append("\r\n\r\n")
            writer.append(chatId).append("\r\n")

            // Send caption
            writer.append("--" + boundary).append("\r\n")
            writer.append("Content-Disposition: form-data; name=\"caption\"").append("\r\n\r\n")
            writer.append(caption).append("\r\n")

            // Send file
            writer.append("--" + boundary).append("\r\n")
            writer.append("Content-Disposition: form-data; name=\"document\"; filename=\"" + apkFile.name + "\"").append("\r\n")
            writer.append("Content-Type: application/vnd.android.package-archive").append("\r\n\r\n")
            writer.flush()

            FileInputStream inputStream = new FileInputStream(apkFile)
            byte[] buffer = new byte[4096]
            int readBytes
            while ((readBytes = inputStream.read(buffer)) != -1) {
                outputStream.write(buffer, 0, readBytes)
            }
            inputStream.close()
            outputStream.flush()

            writer.append("\r\n").flush()
            writer.append("--" + boundary + "--").append("\r\n").flush()
            writer.close()

            int responseCode = conn.getResponseCode()
            if (responseCode == 200) {
                println "🎉 Berhasil mengirim APK ke Telegram!"
            } else {
                def errStream = conn.getErrorStream()
                def errResp = errStream ? errStream.text : "No error stream"
                println "❌ Gagal mengirim APK, Response Code: ${responseCode}, Response: ${errResp}"
            }
        } else {
            println "❌ File APK tidak ditemukan!"
        }
    }
}
