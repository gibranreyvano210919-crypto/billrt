name: Build Android APK and Send to Telegram

on:
  push:
    branches:
      - main  # Berjalan otomatis setiap ada push ke branch main
  workflow_dispatch:  # Bisa dijalankan manual dari tab Actions di GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact (GitHub Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Billrt-Debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Send Notification to Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: "5818535303:AAE78Ew9YsjdDEjWqXW0y-NkkoZ5bGCvuzg"
          TELEGRAM_CHAT_ID: "5396063519"
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="✅ Build APK Berhasil! (Billrt Lite)%0A📦 Ukuran APK: ~67 MB (Melebihi batas 50MB Telegram Bot API)%0A📥 Download APK via GitHub Artifacts:%0A$RUN_URL"
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
               --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
               --data-urlencode "text=$MESSAGE"
