name: Build & Release APK

on:
  push:
    tags:
      - 'v*' # Workflow jalan hanya saat kamu buat tag baru (contoh: v1.0)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Penting agar GitHub bisa upload file ke Release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/*.apk # Mengambil semua APK di folder release
          body: "Silakan download APK terbaru di bawah ini."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}