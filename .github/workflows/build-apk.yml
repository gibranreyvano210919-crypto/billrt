name: Build Android APK and Send to Telegram

on:
  push:
    branches:
      - main  # Berjalan otomatis setiap ada push ke branch main
  workflow_dispatch:  # Bisa dijalankan manual dari tab Actions di GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact (GitHub Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Billrt-Debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Send APK to Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: "5934206711:AAFA04QmCLsX0yXEsB1f4ZZPScnvT2EB3p4"
          TELEGRAM_CHAT_ID: "5396063519"
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Mengirim APK ke Telegram..."
            CAPTION="✅ Build APK Berhasil! (Billrt Lite)%0A📦 File: $(basename "$APK_PATH")"
            curl -F chat_id="$TELEGRAM_CHAT_ID" \
                 -F document=@"$APK_PATH" \
                 -F caption="$CAPTION" \
                 "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument"
          else
            echo "Error: APK tidak ditemukan di path tersebut!"
            exit 1
          fi
